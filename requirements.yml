    version: 1.1.2

  - name: rhel9_cis
    src: https://github.com/ansible-lockdown/RHEL9-CIS.git
    scm: git
    version: 2.4.2

collections:
  - name: ansible.posix
  - name: community.general
  - name: community.crypto
