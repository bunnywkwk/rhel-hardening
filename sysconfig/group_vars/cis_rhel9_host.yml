---
# CIS RHEL 9 v2.0.0 Level 1 Server baseline, role RHEL9-CIS 2.4.2. Same decisions as cis_rhel10_host.yml.
# Not yet run or audited on a RHEL 9 host. A rule set to false is skipped.

# Site
rhel9cis_sshd_allowusers: "frqadmin sysadmin"
rhel9cis_authselect_custom_profile_name: "rhel9"
rhel9cis_disruption_high: true   # lets the role switch authselect/PAM
rhel9cis_warning_banner: |4  # no backslashes (1.7.x)
    ==============================================
     █████╗ ███████╗██████╗  ██████╗ ███╗   ██╗
    ██╔══██╗██╔════╝██╔══██╗██╔═══██╗████╗  ██║
    ███████║█████╗  ██████╔╝██║   ██║██╔██╗ ██║
    ██╔══██║██╔══╝  ██╔══██╗██║   ██║██║╚██╗██║
    ██║  ██║███████╗██║  ██║╚██████╔╝██║ ╚████║
    ╚═╝  ╚═╝╚══════╝╚═╝  ╚═╝ ╚═════╝ ╚═╝  ╚═══╝
          lab server

    Authorized users only. All activity may be monitored and reported.

# Decisions
rhel9cis_pam_faillock_deny: 3        # lock after 3 bad passwords (unlock 900 s = role default)
rhel9cis_force_user_maxdays: true    # 365-day max age on existing users (root: chage by hand)
rhel9cis_ipv6_required: false        # IPv6 not used
rhel9cis_httpd_server: true          # Apache repo :8081
# Audit stays off (role default): the audit content needs rhel9cis_mta_postfix_installed, which role 2.4.2 does not send.

# Level 1 off
rhel9cis_rule_3_3_1: false    # ip forwarding: Podman ports
rhel9cis_rule_1_2_2_1: false  # dnf update: patching is its own change
rhel9cis_rule_1_2_1_3: false  # repo_gpgcheck: Red Hat repo index is not signed

# Level 2 off (all but 3.2.x, which RHEL 10 applies as Level 1)
rhel9cis_rule_1_1_1_6: false  # squashfs
rhel9cis_rule_1_1_1_7: false
