---
# CIS RHEL 10 v1.0.1 Level 1 Server baseline, role RHEL10-CIS 1.1.2. A rule set to false is skipped.

# Site
rhel10cis_sshd_allowusers: "frqadmin sysadmin"
rhel10cis_authselect_custom_profile_name: "rhel10"
rhel10cis_disruption_high: true   # lets the role switch authselect/PAM
rhel10cis_warning_banner: |4  # no backslashes (1.7.x)
    ==============================================
     █████╗ ███████╗██████╗  ██████╗ ███╗   ██╗
    ██╔══██╗██╔════╝██╔══██╗██╔═══██╗████╗  ██║
    ███████║█████╗  ██████╔╝██║   ██║██╔██╗ ██║
    ██╔══██║██╔══╝  ██╔══██╗██║   ██║██║╚██╗██║
    ██║  ██║███████╗██║  ██║╚██████╔╝██║ ╚████║
    ╚═╝  ╚═╝╚══════╝╚═╝  ╚═╝ ╚═════╝ ╚═╝  ╚═══╝
          lab server  -  package repo + registry

    Authorized users only. All activity may be monitored and reported.

# Decisions
rhel10cis_pam_faillock_deny: 3           # lock after 3 bad passwords
rhel10cis_pam_faillock_unlock_time: 900  # 15 min
rhel10cis_force_user_maxdays: true       # 365-day max age on existing users (root: chage by hand)
rhel10cis_ipv6_required: false           # IPv6 not used
rhel10cis_httpd_server: true             # Apache repo :8081
rhel10cis_nfs_server: true
# Audit stays off (role default): with 1.1.2 it stops the run (syver version, missing vars; reported upstream).

# Level 1 off
rhel10cis_rule_3_3_1_2: false  # forwarding: Podman ports
rhel10cis_rule_3_3_1_3: false  # forwarding: Podman ports
rhel10cis_rule_1_2_2_1: false  # dnf update: patching is its own change
